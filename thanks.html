<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="Your Trading Post request has been received. Return to the Trading Kitchen pantry for recipes and stories of resilience.">
    <link rel="canonical" href="https://tradingkitchen.org/thanks.html">
    <meta name="theme-color" content="#fdf8e6">
    <meta property="og:site_name" content="Trading Kitchen">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Thank You - Trading Kitchen">
    <meta property="og:description" content="Your Trading Post request has been received. Return to the Trading Kitchen pantry for recipes and stories of resilience.">

    <meta name="twitter:card" content="summary">
    <meta name="robots" content="noindex, follow">
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="assets/tailwind.css">
    <!-- Era-appropriate fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'EB Garamond', serif;
            background-color: #fdf8e6; /* Warm Yellowish Parchment */
            color: #1a1a1a;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Merriweather', serif;
            font-weight: 700;
        }

        /* Vignette and Radial Blur Effects (Background Layer) */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -2;
            background-color: #fdf8e6;
        }

        body::after {
            content: "";
            position: fixed;
            inset: -100px;
            pointer-events: none;
            z-index: -1;
            background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.4) 100%);
            filter: blur(10px);
            -webkit-filter: blur(10px);
        }

        @media print {
            html, body {
                background-color: #FFFFFF !important;
                background: #FFFFFF !important;
                color: #000000 !important;
            }
            body::before, body::after {
                display: none !important;
            }
        }
    </style>
    <link rel="stylesheet" href="assets/site.css">
    <link rel="icon" type="image/png" href="T.png">
</head>
<body class="antialiased leading-relaxed min-h-screen flex items-center justify-center p-6">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <main id="main-content" class="max-w-2xl w-full bg-white p-8 md:p-12 rounded-lg shadow-xl border-2 border-black text-center">
        <h1 class="text-4xl md:text-6xl font-bold mb-6 text-black">Request Received</h1>
        <div class="text-xl md:text-2xl space-y-6 mb-8">
            <p>Your request for access to <strong>The Trading Post</strong> has been logged in the ledger.</p>
            <p>We are building a system that values human dignity and sovereign trade. We will reach out when the gates are open.</p>
        </div>
        
        <a href="index.html" class="inline-block bg-black text-white py-4 px-10 rounded-lg font-bold text-xl hover:bg-gray-800 transition-all transform hover:scale-105 active:scale-95">
            Return to The Pantry
        </a>

        <footer class="mt-12 text-gray-500 text-sm italic">
            "Resilience is decentralized."
        </footer>
    </main>

</body>
</html>
